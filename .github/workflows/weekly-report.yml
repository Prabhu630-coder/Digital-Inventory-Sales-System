name: Weekly Sales Report
on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:
jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Call report endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --show-error --silent -H "X-Cron-Secret: $CRON_SECRET" "$APP_URL/tasks/weekly-report"
